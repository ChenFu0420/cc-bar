name: CI

# 临时验证用：推送 ci/ 分支时编译并跑单元测试；不打包、不发布。
on:
  push:
    branches: ['ci/**']

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 编译并运行单元测试
        run: |
          set -o pipefail
          xcodebuild -project ccbar.xcodeproj -scheme ccbar \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO \
            test

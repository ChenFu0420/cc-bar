name: CI

# 临时验证用：推送 ci/ 分支时跑 ClaudeAuthTests，并打包一份 ad-hoc 签名的测试版 App
# 作为 Actions artifact 下载；不创建 Release、不生成 appcast。
on:
  push:
    branches: ['ci/**']

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DERIVED: ${{ github.workspace }}/build-ci
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 测试以 CCBar.app 为宿主运行，arm64 上未签名的 App 无法启动，因此用 ad-hoc 签名（"-"）。
      - name: 编译 App 与测试
        run: |
          set -o pipefail
          xcodebuild -project ccbar.xcodeproj -scheme ccbar \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            build-for-testing

      # 首次出现的 “Could not launch CCBarTests” 是 LaunchServices 首次尝试失败，可忽略。
      # 完整测试集在 CI 上会在 QuotaAlertTests 附近卡住（与本次修复无关），这里只跑本次修复的回归测试。
      - name: 运行 ClaudeAuthTests
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild -project ccbar.xcodeproj -scheme ccbar \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            -only-testing:CCBarTests/ClaudeAuthTests \
            test-without-building

      # 公钥与 project.pbxproj 中的 SPARKLE_PUBLIC_ED_KEY 相同（公开值，非密钥）。
      - name: 打包测试版（scripts/build.sh）
        env:
          SPARKLE_PUBLIC_ED_KEY: ZBP7TIEjReojbAckWVPq4ShHcG1o9+nAEm4hfsfhj98=
        run: |
          ./scripts/build.sh
          lipo -archs build/Build/Products/Release/CCBar.app/Contents/MacOS/CCBar

      - name: 上传测试版
        uses: actions/upload-artifact@v4
        with:
          name: CCBar-${{ github.sha }}
          path: |
            dist/CCBar.dmg
            dist/CCBar.app.zip
          retention-days: 7
          if-no-files-found: error
